<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sensor Disc</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230f766e'/><path d='M5 17h5l3-8 4 15 3-7h7' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <header class="topbar">
        <div class="identity">
            <h1>Sensor Disc</h1>
            <p id="link-status" class="link-status">Not connected</p>
        </div>

        <div class="battery" id="battery" hidden>
            <div class="battery-gauge"><span id="battery-fill"></span></div>
            <span class="battery-percent" id="battery-percent">--</span>
            <span class="battery-status" id="battery-status" hidden></span>
        </div>

        <button type="button" id="connect" class="button primary">Connect</button>
    </header>

    <section class="recordbar">
        <button type="button" id="record" class="button record" disabled>Start recording</button>
        <p id="record-status" class="record-status">Not recording</p>

        <p id="link-rate" class="link-rate"></p>

        <label class="window">Chart window
            <select id="window">
                <option value="5">5 seconds</option>
                <option value="10" selected>10 seconds</option>
                <option value="30">30 seconds</option>
                <option value="60">60 seconds</option>
                <option value="300">5 minutes</option>
            </select>
        </label>
    </section>

    <p id="message" class="message" role="status"></p>

    <main id="sensors" class="sensors"></main>
</body>

</html>
